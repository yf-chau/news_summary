name: Weekly News Digest

on:
  schedule:
    - cron: "48 22 * * 5"   # Friday 22:48 UTC = Saturday 06:48 HKT
  workflow_dispatch:        # Allow manual trigger from GitHub UI

jobs:
  run-digest:
    runs-on: self-hosted
    steps:
      - name: Prevent sleep for the whole job
        # macOS forces "Maintenance Sleep" even mid-step, which suspends the
        # network and makes GitHub cancel the job with "runner lost
        # communication". This must cover EVERY step, not just the pipeline:
        # run 31848809059 died 20s into the article fetch. -s =
        # PreventSystemSleep (holds the Mac awake even in DarkWake); -i
        # (idle-only) does not override Maintenance Sleep. -t 5400 is a
        # self-expiring backstop so the lock can't leak if the job is killed
        # before the release step runs.
        run: |
          nohup caffeinate -s -t 5400 >/dev/null 2>&1 &
          echo "CAFFEINATE_PID=$!" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Restore cached articles
        uses: actions/cache/restore@v4
        with:
          path: data/articles.jsonl
          key: articles-${{ github.run_id }}
          restore-keys: articles-

      - name: Fetch today's articles
        run: uv run --no-dev python fetch_articles.py

      - name: Save cached articles
        uses: actions/cache/save@v4
        with:
          path: data/articles.jsonl
          key: articles-${{ github.run_id }}

      - name: Run pipeline
        run: uv run --no-dev python main.py

      - name: Release sleep lock
        if: always()
        run: kill "$CAFFEINATE_PID" 2>/dev/null || true

      - name: Notify on failure
        if: failure()
        run: |
          echo "## :x: Weekly News Digest failed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The pipeline failed. If the exit code was **2**, the SUBSTACK_SID cookie has likely expired." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Action required:** Update the \`SUBSTACK_SID\` in the \`.env\` file on the self-hosted runner with a fresh cookie from a browser session." >> "$GITHUB_STEP_SUMMARY"
